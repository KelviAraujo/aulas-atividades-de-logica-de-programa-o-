<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
      <div class="container-fluid">
        <a class="navbar-brand">Controle</a>
        <div class="d-flex">
          <span id="user-badge" class="me-2"></span>
          <a href="/templates/login.html" class="btn btn-outline-primary btn-sm me-2">Login</a>
          <button id="logout" class="btn btn-outline-danger btn-sm me-2" style="display:none;">Sair</button>
          <a href="/admin/users" class="btn btn-outline-secondary btn-sm">Admin</a>
        </div>
      </div>
    </nav>

    <h1 class="mb-4">Cadastro de Clientes</h1>

    <div class="row">
      <div class="col-md-5">
        <form id="client-form">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" name="telefone">
          </div>
          <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" name="cpf">
          </div>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </form>
      </div>
      <div class="col-md-7">
        <h4>Lista</h4>
        <div class="mb-2">
          <input type="file" id="file-import" accept=".csv" class="form-control form-control-sm mb-2" />
          <button class="btn btn-sm btn-secondary" id="import-btn">Importar CSV</button>
          <button class="btn btn-sm btn-secondary" id="export-btn">Exportar CSV</button>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </div>

  <script>
    async function fetchList(){
      const res = await fetch('/api/customers');
      const data = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = data.map(c => `
        <div class="card mb-2">
          <div class="card-body">
            <h5>${c.nome} <small class="text-muted">${c.email}</small></h5>
            <p>${c.cpf || ''} ${c.telefone ? '· ' + c.telefone : ''}</p>
            <button class="btn btn-sm btn-danger" onclick="del(${c.id})">Excluir</button>
          </div>
        </div>
      `).join('');
    }

    async function del(id){
      if(!confirm('Excluir cliente?')) return;
      await fetch('/api/customers/' + id, {method: 'DELETE'});
      fetchList();
    }

    async function getMe(){
      const res = await fetch('/api/me');
      if(res.ok){
        const j = await res.json();
        document.getElementById('user-badge').innerText = j.username || '';
        document.getElementById('logout').style.display = 'inline-block';
      }
    }

    document.getElementById('logout').addEventListener('click', async ()=>{
      await fetch('/auth/logout', {method:'POST'});
      window.location.reload();
    })

    document.getElementById('export-btn').addEventListener('click', ()=>{
      window.location = '/api/customers/export';
    })

    document.getElementById('import-btn').addEventListener('click', async ()=>{
      const f = document.getElementById('file-import').files[0];
      if(!f){ alert('Escolha um CSV'); return; }
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/customers/import', {method:'POST', body: fd});
      if(res.ok){ alert('Import ok'); fetchList(); } else { alert('Erro import'); }
    });

    document.getElementById('client-form').addEventListener('submit', async (e) =>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      const res = await fetch('/api/customers', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if(res.ok){
        e.target.reset();
        fetchList();
      } else {
        const err = await res.json();
        alert(JSON.stringify(err));
      }
    });

    fetchList();
  </script>
</body>
</html>
